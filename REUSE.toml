version = 1

# Everything is Apache-2.0, so LICENSES/ holds one license text. Files that
# take a comment carry a two-line header in the file itself. The annotations
# below cover files that cannot hold a comment or that tools generate or
# rewrite, and files where a header would be noise.

# Lockfiles and other generated files.
[[annotations]]
path = [
  "mise.lock",
  "MODULE.bazel.lock",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Version pins and ignore lists that hold one value per line, so tools read
# every line and a comment would break them.
[[annotations]]
path = [
  "**/.bazelversion",
  "**/.bazelignore",
  ".gitleaksignore",
  ".rylignore",
  ".cspell-words.txt",
  ".vale/config/vocabularies/project/*.txt",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# JSON cannot hold comments.
[[annotations]]
path = ["**/*.json"]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Dotfiles and docs that can take a comment but where GitHub or the
# toolchain expects the file to start with its own content. CODEOWNERS and
# README.md render on GitHub (the PR template becomes each PR's body), and
# LICENSE is the verbatim license text that GitHub's license detection reads,
# so it must not gain a header.
[[annotations]]
path = [
  "LICENSE",
  "README.md",
  ".github/CODEOWNERS",
  ".github/PULL_REQUEST_TEMPLATE.md",
  ".gitattributes",
  ".gitignore",
  ".editorconfig",
  ".cspell.jsonc",
  ".bazelrc",
  "preset.bazelrc",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Markdown that harnesses read verbatim, so a header comment would break it.
[[annotations]]
path = [
  "**/AGENTS.md",
  "**/CLAUDE.md",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"
