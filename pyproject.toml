# Repo-level Python environment. This repository has no Python of its own:
# the only Python is tools/interim/, a verbatim copy of ascm's PR and
# attribution scripts, which ascm lints and tests at the source. This file
# pins what those scripts and the git hooks need. `package = false` keeps the
# root virtual: uv syncs the dependency groups into .venv without trying to
# build the root.
[project]
name = "spikes-workspace"
# Inert. Nothing builds or publishes from this table.
version = "0"
description = "Repo-local Python tooling for spikes"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
  # The interim PR and identity scripts validate drafts and frontmatter at run time.
  "jsonschema[format]>=4.26.0",
  # Installs and runs the git hooks (tools/interim/install.sh).
  "prek==0.5.9",
  "pyyaml>=6.0.3",
]

[tool.uv]
package = false
# mise pins uv in [tools], but that pin binds only where mise resolves
# PATH. An editor, a hook, or a contributor's own install runs whatever uv it
# finds, and a resolver from another minor line rewrites uv.lock in ways
# `uv lock --check` then reports as drift. This range is uv refusing to run
# rather than the lockfile churning. Move it with the mise pin.
required-version = ">=0.13.0,<0.14"
